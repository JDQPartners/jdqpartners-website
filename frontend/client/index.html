<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JDQ Partners is a Sydney-based private credit lender and investment manager." />
    <meta name="theme-color" content="#12302c" />
    <title>JDQ Partners | Private Credit, Sydney</title>
  </head>
  <body>
    <!-- Netlify scans this static form during deployment. The visible form is rendered by React. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="phone" />
      <select name="interest">
        <option value="Investing with JDQ">Investing with JDQ</option>
        <option value="Borrowing from JDQ">Borrowing from JDQ</option>
        <option value="General enquiry">General enquiry</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
